[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "laboratorio-espalhamento"
version = "1.16.0"
description = "Laboratório numérico de espalhamento de baixa energia — rumo à física de Efimov em crossover dimensional"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Pedro Henrique Gesualdo Modesto"}]
license = {text = "MIT"}
keywords = ["scattering", "efimov", "ultracold-atoms", "few-body", "numerov"]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "pyflakes", "nbclient", "nbformat"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
